apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/kuanmol/ci-cd-devops.git'
    targetRevision: main
    path: k8s/user
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: micro
    createNamespace: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true