apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: product-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/kuanmol/ci-cd-devops.git'
    targetRevision: main
    path: k8s/product
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: micro
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true