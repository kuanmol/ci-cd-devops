name: Microservices CI

on:
  push:
    branches: ["main"]

jobs:

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changes.outputs.services }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect changed services
        id: changes
        run: |
          services=()

          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q "services/product-service/"; then
            services+=("product-service")
          fi

          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q "services/order-service/"; then
            services+=("order-service")
          fi

          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q "services/payment-service/"; then
            services+=("payment-service")
          fi

          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q "services/user-service/"; then
            services+=("user-service")
          fi

          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q "services/notification-service/"; then
            services+=("notification-service")
          fi

          json=$(printf '%s\n' "${services[@]}" | jq -R . | jq -s .)
          echo "services=$json" >> $GITHUB_OUTPUT

  build:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' }}

    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build & Push Docker Image
        run: |
          docker build -t anmolk992/${{ matrix.service }}:${{ env.IMAGE_TAG }} ./services/${{ matrix.service }}
          docker push anmolk992/${{ matrix.service }}:${{ env.IMAGE_TAG }}