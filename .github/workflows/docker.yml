name: FastApi CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Image with SHA tag
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          docker build -t DOCKER_USERNAME/fastapi-devops:$IMAGE_TAG .
          docker push DOCKER_USERNAME/fastapi-devops:$IMAGE_TAG
